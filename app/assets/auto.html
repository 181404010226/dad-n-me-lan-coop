<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#201934"><title>狂扁小朋友 · 自动双人</title><link rel="stylesheet" href="style.css"><script defer src="input.js"></script><script defer src="presentation.js"></script><script defer src="auto.js"></script><body>
<div id="connection" hidden>连接中断，正在自动重连…</div>
<main id="app" class="auto-shell"><div class="brand">狂扁小朋友 · 清爽双人版</div><div id="pair-badge" class="auto-badge p1">自动分配角色</div><h1 id="pair-title">正在寻找搭档…</h1><p id="pair-note">两台手机安装同一个应用，连接同一无线网络。<br>打开后自动配对、分配角色并开局。</p><p id="pair-status" class="quiet">正在准备本机游戏…</p><div class="row auto-actions"><button id="wifi">网络设置</button><button id="find-again">重新寻找</button></div></main>
<section id="game" hidden><header><strong>狂扁小朋友 <small>自动双人</small></strong><span id="metrics">连接正常</span><nav><button id="sound">声音开</button><button id="pause">暂停</button><button id="menu">菜单</button></nav></header><div id="playfield"><div id="stage"><div id="display"></div><div id="overlay" hidden></div></div><div id="joystick" role="group" aria-label="方向摇杆" aria-disabled="true"><img class="stick-base" src="controls/base.png" alt=""><img id="stick-knob" src="controls/knob.png" alt=""><span class="stick-label">方向</span></div><div class="attacks"><button data-control="light">轻击</button><button data-control="heavy">重击</button><button data-control="both">组合技</button></div></div><footer><b id="role"></b><span>摇杆移动 · 多指攻击 · 连推方向冲刺</span></footer></section>
<dialog id="modal"><div id="modal-body"></div><button id="modal-close">继续游戏</button></dialog><div id="toast" hidden></div></body></html>
