<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#201934"><title>狂扁小朋友 · 双人合作</title><link rel="stylesheet" href="style.css"><script defer src="qr.js"></script><script defer src="app.js"></script><body>
<div id="connection" hidden>连接中断，正在恢复。请保持同一 无线网络。</div><main id="app"><p>正在打开双人房间…</p></main>
<section id="game" hidden><header><strong>狂扁小朋友 <small>双人合作</small></strong><span id="metrics">每秒 30 帧</span><nav><button id="sound">声音开</button><button id="pause">暂停</button><button id="menu">菜单</button></nav></header><div id="playfield"><div id="stage"><div id="display"></div><div id="overlay" hidden></div></div>
<div id="joystick" role="group" aria-label="方向摇杆" aria-disabled="true"><img class="stick-base" src="controls/base.png" alt=""><img id="stick-knob" src="controls/knob.png" alt=""><span class="stick-label">方向</span></div>
<div class="attacks"><button data-control="light">轻击</button><button data-control="heavy">重击</button><button data-control="both">组合技</button></div></div><footer><b id="role"></b><span>摇杆移动 · 轻击 / 重击 · 连推方向冲刺</span></footer></section>
<dialog id="modal"><div id="modal-body"></div><button id="modal-close">返回</button></dialog><div id="toast" hidden></div></body></html>
